[workspace]
resolver = "2"
members = [
    "crates/pt-core",
    "crates/pt-entitlement",
    "crates/pt-admission",
    "crates/pt-gateway",
    "crates/pt-mock-engine",
    "crates/pt-crds",
    "crates/pt-operator",
    "crates/pt-control-plane",
    "crates/pt-quota",
    "crates/pt-telemetry",
    "crates/pt-router",
    "crates/pt-tokenize",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
pt-core = { path = "crates/pt-core" }
pt-admission = { path = "crates/pt-admission" }
pt-mock-engine = { path = "crates/pt-mock-engine" }
pt-crds = { path = "crates/pt-crds" }
pt-entitlement = { path = "crates/pt-entitlement" }
pt-control-plane = { path = "crates/pt-control-plane" }
# Gateways need only the wire types; the coordinator binary builds with its `kube` default.
pt-quota = { path = "crates/pt-quota", default-features = false }
pt-telemetry = { path = "crates/pt-telemetry" }
pt-tokenize = { path = "crates/pt-tokenize" }

anyhow = "1"
axum = "0.8"
bytes = "1"
ed25519-dalek = "3"
futures = "0.3"
jiff = { version = "0.2", features = ["serde"] }
k8s-openapi = { version = "0.28", features = ["latest"] }
# Crates opt into features. The operator uses rustls with the ring provider, which builds without cmake.
kube = { version = "4.2", default-features = false }
# Plain HTTP only: engines are reached inside the cluster. Avoids TLS C build deps.
reqwest = { version = "0.12", default-features = false, features = ["stream", "json"] }
# TLS: rustls with the ring provider only; the default features would pull in aws-lc
# (cmake) (ADR-021, ADR-022).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring"] }
serde = { version = "1", features = ["derive"] }
# Control-plane store over the Postgres protocol (CockroachDB or PostgreSQL). TLS uses
# rustls with the ring provider, which builds without cmake (ADR-021).
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "json", "time", "tls-rustls-ring-webpki"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
schemars = "1"
thiserror = "2"
# Model tokenizers (tokenizer.json). Pure-Rust regex backend: the default `onig` and
# `esaxx_fast` features build C/C++ code (ADR-028).
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync", "signal"] }
time = "0.3"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
