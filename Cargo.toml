[workspace]
resolver = "2"
members = [
    "crates/pt-core",
    "crates/pt-entitlement",
    "crates/pt-admission",
    "crates/pt-gateway",
    "crates/pt-mock-engine",
    "crates/pt-crds",
    "crates/pt-operator",
    "crates/pt-control-plane",
    "crates/pt-quota",
    "crates/pt-telemetry",
    "crates/pt-router",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
pt-core = { path = "crates/pt-core" }
pt-admission = { path = "crates/pt-admission" }
pt-mock-engine = { path = "crates/pt-mock-engine" }
pt-crds = { path = "crates/pt-crds" }
pt-entitlement = { path = "crates/pt-entitlement" }
pt-control-plane = { path = "crates/pt-control-plane" }
pt-quota = { path = "crates/pt-quota" }
pt-telemetry = { path = "crates/pt-telemetry" }

anyhow = "1"
axum = "0.8"
bytes = "1"
ed25519-dalek = "3"
futures = "0.3"
jiff = { version = "0.2", features = ["serde"] }
k8s-openapi = { version = "0.28", features = ["latest"] }
# Crates opt into features. The operator uses rustls with the ring provider, which builds without cmake.
kube = { version = "4.2", default-features = false }
# Plain HTTP only: engines are reached inside the cluster. Avoids TLS C build deps.
reqwest = { version = "0.12", default-features = false, features = ["stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
schemars = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync", "signal"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
