[workspace]
resolver = "2"
members = [
    "crates/pt-core",
    "crates/pt-admission",
    "crates/pt-gateway",
    "crates/pt-mock-engine",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
pt-core = { path = "crates/pt-core" }
pt-admission = { path = "crates/pt-admission" }
pt-mock-engine = { path = "crates/pt-mock-engine" }

anyhow = "1"
axum = "0.8"
bytes = "1"
futures = "0.3"
# Plain HTTP only: engines are reached inside the cluster. Avoids TLS C build deps.
reqwest = { version = "0.12", default-features = false, features = ["stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync", "signal"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
