[package]
name = "pt-entitlement"
description = "Signed, versioned entitlement snapshots from the control plane to regional gateways"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
pt-core.workspace = true
pt-admission.workspace = true
ed25519-dalek.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
uuid.workspace = true
# Optional: an HTTPS client for talking to the control plane (ADR-022).
reqwest = { workspace = true, optional = true, features = ["rustls-tls-webpki-roots"] }

[features]
client = ["dep:reqwest"]
