[package]
name = "pt-quota"
description = "Quota Coordinator: splits each reservation's regional entitlement across gateways with short leases (ADR-003, ADR-012)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["kube"]
# The Kubernetes Lease backend for leader election (ADR-027).
kube = ["pt-election/kube"]

[dependencies]
anyhow.workspace = true
axum.workspace = true
pt-election.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
reqwest.workspace = true

[[bin]]
name = "pt-quota-coordinator"
path = "src/main.rs"
