# Two replicas, active/standby on the pt-operator Lease (ADR-029). Only the leader
# reconciles; on SIGTERM it releases the lease, so a rolling update hands over at once.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pt-operator
  namespace: pt-system
  labels:
    app.kubernetes.io/name: pt-operator
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: pt-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pt-operator
    spec:
      serviceAccountName: pt-operator
      terminationGracePeriodSeconds: 30
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: pt-operator
                topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          # Build with deploy/operator/Dockerfile and push to your registry.
          image: pt-operator:dev
          env:
            - name: RUST_LOG
              value: info,pt_operator=debug
            # Leader election identity and lease namespace (ADR-029).
            - name: POD_NAME
              valueFrom:
                fieldRef: { fieldPath: metadata.name }
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef: { fieldPath: metadata.namespace }
            # Follow the region's entitlement snapshot to load warm spares on failover
            # (docs/07 §4). Without these, failover demand is ignored.
            - name: PT_CONTROL_PLANE_URL
              value: https://control-plane.pt.example.com
            - name: PT_REGION
              value: eu-central
            - name: PT_REGION_TOKEN
              valueFrom:
                secretKeyRef: { name: pt-region, key: token }
            # Comma-separated during a signing-key rotation (ADR-020).
            - name: PT_SNAPSHOT_PUBLIC_KEY
              valueFrom:
                secretKeyRef: { name: pt-region, key: snapshot-public-key }
            # TLS to the control plane (ADR-022). With a private CA and mutual TLS:
            # - name: PT_CONTROL_PLANE_CA
            #   value: /etc/pt/tls/ca.pem
            # - name: PT_CONTROL_PLANE_CLIENT_CERT
            #   value: /etc/pt/tls/tls.crt
            # - name: PT_CONTROL_PLANE_CLIENT_KEY
            #   value: /etc/pt/tls/tls.key
            - name: PT_SNAPSHOT_CACHE
              value: /var/cache/pt/entitlements.json
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: snapshot-cache
              mountPath: /var/cache/pt
      volumes:
        # Survives container restarts, not pod rescheduling. Use a PVC to survive both.
        - name: snapshot-cache
          emptyDir: {}
