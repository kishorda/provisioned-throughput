apiVersion: v1
kind: Namespace
metadata:
  name: pt-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pt-operator
  namespace: pt-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pt-operator
rules:
  - apiGroups: ["pt.example.com"]
    resources: ["modelpools", "poolallocations", "performanceprofiles", "capacityreservations"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["pt.example.com"]
    resources: ["modelpools/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["nvidia.com"]
    resources: ["dynamographdeployments"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pt-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pt-operator
subjects:
  - kind: ServiceAccount
    name: pt-operator
    namespace: pt-system
---
# Leader election (ADR-029): replicas compete for the pt-operator Lease.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pt-operator-leader
  namespace: pt-system
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pt-operator-leader
  namespace: pt-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pt-operator-leader
subjects:
  - kind: ServiceAccount
    name: pt-operator
    namespace: pt-system
