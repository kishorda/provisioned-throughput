# Local development configuration for pt-control-plane.
# Tenants, the model catalog, and capacity come from other services in production.
# Prices and capacities are placeholders.

[server]
listen = "127.0.0.1:8090"
endpoint_template = "https://{region}.pt.example.com/v1"
lifecycle_interval_secs = 60

[pricing]
currency = "USD"
base_cu_price_per_month_cents = 150000  # one Standard CU for one month

# PAYG list prices, in cents per million tokens. Spillover is billed as regular PAYG
# traffic, so these must mirror the PAYG product's price list. Development values.
[[payg_prices]]
model = "llama-4-maverick"
input_per_mtok = 27
cached_input_per_mtok = 7
output_per_mtok = 85

[[payg_prices]]
model = "qwen3-32b"
input_per_mtok = 10
cached_input_per_mtok = 3
output_per_mtok = 30

# Monthly invoices (ADR-018): calendar months, in arrears, finalised after a grace period.
[billing]
finalize_grace_hours = 48
finalize_interval_secs = 3600

# Signs entitlement snapshots. A development key only: production reads it from a
# secret store. The matching public key goes in each gateway's [entitlements] section.
[entitlements]
signing_key = "653d2967965c4705b7cd3703484ef9835995b0db06894437a355824aaf48a8fe"

# Customer usage and SLA reports (docs/09). wu_per_cu must match the gateways'.
[telemetry]
wu_per_cu = 1000.0
retention_days = 35
change_grace_minutes = 10      # SLA exclusion after activation, resizes, shape changes
failover_window_minutes = 5    # multi-region SLA exclusion after a region incident starts

# Durable store (ADR-017): CockroachDB in production, PostgreSQL works for development.
# Without it, state is in memory and lost on restart. PT_DATABASE_URL overrides `url`.
# [store]
# url = "postgres://postgres@127.0.0.1:55432/pt"
# max_connections = 10
# migrate = true            # apply pending migrations at startup

# Operator API for declaring region incidents (development key).
[operators]
api_key = "sk-operator-dev"

# Automatic region-failure handling (docs/07 §4). Gateways heartbeat every 5 s.
[failover]
auto_declare = true
heartbeat_timeout_seconds = 30  # no serving gateway for this long: region down
recovery_seconds = 60           # serving continuously for this long: incident resolved
return_ramp_minutes = 10        # failover entitlement and DNS weight return at 10% a minute
check_interval_ms = 1000

# Regions whose gateways pull snapshots and push usage, and their tokens (development values).
# `pair` is the preferred failover region; `residency` bounds where failover may go.
[[regions]]
name = "eu-west"
token = "region-token-eu-west-dev"
pair = "eu-central"
residency = "eu"

[[regions]]
name = "eu-central"
token = "region-token-eu-central-dev"
pair = "eu-west"
residency = "eu"

[[regions]]
name = "us-east"
token = "region-token-us-east-dev"
residency = "us"

[[tenants]]
id = "acme"
admin_api_key = "sk-admin-acme-dev"

[[tenants]]
id = "globex"
admin_api_key = "sk-admin-globex-dev"

[[models]]
id = "llama-4-maverick"
display_name = "Llama 4 Maverick"
max_context = 131072
tiers = ["interactive", "agentic", "standard"]

[[models]]
id = "qwen3-32b"
display_name = "Qwen3 32B"
max_context = 32768
tiers = ["interactive", "standard"]

# Sellable CUs per region and model. eu-central has no disaggregated pools for Maverick,
# so it serves shorter contexts.
[[capacity]]
region = "eu-west"
model = "llama-4-maverick"
cus = 200
max_context = 131072
profile = "llama-4-maverick.b200.trtllm-1.2.tp8"

[[capacity]]
region = "eu-central"
model = "llama-4-maverick"
cus = 100
max_context = 32768
profile = "llama-4-maverick.h200.vllm-0.11.tp8"

[[capacity]]
region = "us-east"
model = "llama-4-maverick"
cus = 300
max_context = 131072
profile = "llama-4-maverick.b200.trtllm-1.2.tp8"

[[capacity]]
region = "us-east"
model = "qwen3-32b"
cus = 100
max_context = 32768
profile = "qwen3-32b.h200.vllm-0.11.tp2"

# Calibrated cost profiles (stand-in for the Profile Registry). Coefficients are
# placeholders until calibration runs. WU is normalised across hardware, so the same model
# costs the same WU on B200 and H200; the hardware difference shows up in replica capacity.
[[profiles]]
name = "llama-4-maverick.b200.trtllm-1.2.tp8"
coefficients = { a = 1.00, b = 0.08, c = 3.10, d = 0.00021 }
capacity_wu_per_s = { interactive = 41000.0, agentic = 35500.0, standard = 58000.0 }

[[profiles]]
name = "llama-4-maverick.h200.vllm-0.11.tp8"
coefficients = { a = 1.00, b = 0.08, c = 3.10, d = 0.00021 }
capacity_wu_per_s = { interactive = 24000.0, agentic = 21000.0, standard = 34000.0 }

[[profiles]]
name = "qwen3-32b.h200.vllm-0.11.tp2"
coefficients = { a = 0.30, b = 0.03, c = 0.90, d = 0.00005 }
capacity_wu_per_s = { interactive = 30000.0, agentic = 26000.0, standard = 42000.0 }
