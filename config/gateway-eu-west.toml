# pt-gateway for eu-west, with entitlements synced from the control plane.
# Compare config/gateway.toml, which lists reservations statically.

[server]
listen = "127.0.0.1:8081"
engine_url = "http://127.0.0.1:9000"
payg_engine_url = "http://127.0.0.1:9001"
usage_log = "usage-eu-west.jsonl"
wu_per_cu = 1000.0

[entitlements]
control_plane_url = "http://127.0.0.1:8090"
region = "eu-west"
token = "region-token-eu-west-dev"
# Public half of the development signing key in config/control-plane.toml.
public_key = "b51da0aa7183df2b9a9ac31f26e8f856fd8b818d1118cdb87c9253afe13bb164"
cache_path = "entitlements-eu-west.json"
wait_secs = 30

# Push usage records to the control plane's telemetry API (customer usage and SLA reports).
[usage_export]
control_plane_url = "http://127.0.0.1:8090"
token = "region-token-eu-west-dev"
batch_size = 500
flush_interval_ms = 1000

# Share each reservation's eu-west entitlement with the other gateway replicas.
# Remove this section to run a single replica that enforces the full entitlement.
[quota]
coordinator_url = "http://127.0.0.1:8095"
token = "quota-token-eu-west-dev"
renew_interval_ms = 250
assumed_gateways = 3        # share before the first lease
fallback_decay_secs = 30    # coordinator unreachable: decay to 50% ÷ replicas

# Profiles for this region's pools. Snapshots name the profile per reservation.
[[profiles]]
name = "llama-4-maverick.b200.trtllm-1.2.tp8"
coefficients = { a = 1.00, b = 0.08, c = 3.10, d = 0.00021 }
capacity_wu_per_s = { interactive = 41000.0, agentic = 35500.0, standard = 58000.0 }
